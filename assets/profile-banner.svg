<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="360" viewBox="0 0 1500 360" role="img" aria-labelledby="title desc">
<title id="title">David Pernett — Software Developer</title>
<desc id="desc">Dark charcoal and emerald green banner for a software developer focused on full-stack development and systems integration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/>
    <stop offset=".62" stop-color="#161B22"/>
    <stop offset="1" stop-color="#10251F"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#16A36A" stop-opacity="0"/>
    <stop offset=".55" stop-color="#16A36A" stop-opacity=".9"/>
    <stop offset="1" stop-color="#16A36A" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#E6EDF3" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="35"/></filter>
</defs>
<rect width="1500" height="360" rx="22" fill="url(#bg)"/>
<rect width="1500" height="360" rx="22" fill="url(#grid)"/>
<circle cx="1270" cy="100" r="190" fill="#16A36A" opacity=".12" filter="url(#soft)"/>
<path d="M0 300H1500" stroke="url(#glow)" stroke-width="2"/>
<g fill="none" stroke="#16A36A" stroke-opacity=".5" stroke-width="2">
  <path d="M1110 92h95v54h85v-35h100"/>
  <path d="M1180 220h78v-48h94v-45h100"/>
  <circle cx="1110" cy="92" r="5" fill="#16A36A"/>
  <circle cx="1205" cy="146" r="5" fill="#16A36A"/>
  <circle cx="1290" cy="111" r="5" fill="#16A36A"/>
  <circle cx="1352" cy="127" r="5" fill="#16A36A"/>
  <circle cx="1180" cy="220" r="5" fill="#16A36A"/>
  <circle cx="1258" cy="172" r="5" fill="#16A36A"/>
  <circle cx="1352" cy="127" r="5" fill="#16A36A"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="100" y="145" fill="#16A36A" font-size="18" font-weight="700" letter-spacing="5">SOFTWARE ENGINEERING / PORTFOLIO</text>
  <text x="96" y="220" fill="#E6EDF3" font-size="66" font-weight="750" letter-spacing="-2">DAVID PERNETT</text>
